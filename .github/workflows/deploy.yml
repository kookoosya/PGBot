name: Deploy VPS

on:
  push:
    branches:
      - main
      - cursor/narodny-kontrol-mvp-e7fb
      - cursor/events-vk-moderation-771b
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VPS_PASSWORD }}" ] || [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Пропуск деплоя: нет VPS_PASSWORD и VPS_SSH_KEY в GitHub Secrets."
            echo "Добавьте секрет: Settings → Secrets and variables → Actions → VPS_PASSWORD"
            echo "Затем: Actions → Deploy VPS → Run workflow"
          fi

      - name: Deploy to VPS
        if: steps.creds.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 192.210.213.135
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/pgbot
            BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
            sed -i 's|^PUBLIC_SITE_URL=.*|PUBLIC_SITE_URL=https://pushkinskie-gory.xyz|' .env 2>/dev/null || true
            PRIMARY_DOMAIN=pushkinskie-gory.xyz bash scripts/vps-deploy.sh

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - name: Smoke after deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://pushkinskie-gory.xyz' }}
        run: |
          sleep 15
          bash scripts/smoke-public.sh "$SMOKE_BASE_URL"
          echo "Deploy OK: $SMOKE_BASE_URL"
