name: Deploy VPS

on:
  push:
    branches:
      - main
      - cursor/narodny-kontrol-mvp-e7fb
      - cursor/events-vk-moderation-771b
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VPS_PASSWORD != '' || secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 192.210.213.135
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/pgbot
            BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
            bash scripts/vps-deploy.sh

      - uses: actions/checkout@v4

      - name: Smoke after deploy
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://192-210-213-135.sslip.io' }}
        run: |
          sleep 15
          bash scripts/smoke-public.sh "$SMOKE_BASE_URL"
          echo "Deploy OK: $SMOKE_BASE_URL"
